[project]
name = "hw-14"
version = "0.1.0"
description = ""
authors = [
    {name = "Denis",email = "bekishev.denis@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flake8 (>=7.2.0,<8.0.0)",
    "isort (>=6.0.1,<7.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "coverage (>=7.8.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 119
ignore = "E203, E266, E501, W503"
exclude = ".git, __pycache__, venv, .venv"

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    | \.venv
)/
'''